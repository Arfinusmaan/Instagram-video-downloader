services:
  - type: web
    name: omnistream-downloader
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 7860
      - key: DOWNLOAD_TEMP_DIR
        value: /tmp/omnistream
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=256
